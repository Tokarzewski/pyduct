[package]
name = "venti"
version = "0.1.0"
edition = "2021"
description = "Ductwork design library — sizing, pressure-drop, fitting losses, network solving. Rust port of the wenta/wentamojo Python+Mojo reference."
license = "MIT"
readme = "README.md"

[lib]
name = "venti"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "venti"
path = "src/main.rs"

[features]
default = ["cli"]
cli = ["dep:serde", "dep:serde_json", "dep:serde_yaml", "dep:clap"]
export = ["dep:rust_xlsxwriter"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
serde_yaml = { version = "0.9", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
rust_xlsxwriter = { version = "0.97", optional = true }

[dev-dependencies]

# Build a WebAssembly (wasm32-wasip1) core you can embed from C#, Python, or
# C++ (see the WASM section of the README):
#
#   rustup target add wasm32-wasip1
#   cargo build --release --target wasm32-wasip1 --no-default-features
#
# produces target/wasm32-wasip1/release/libventi.wasm

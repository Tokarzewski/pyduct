name: venti

on:
  push:
    paths:
      - 'venti/**'
      - '.github/workflows/venti.yml'
  pull_request:
    paths:
      - 'venti/**'

env:
  CARGO_TERM_COLOR: always
  working-directory: venti

jobs:
  test:
    name: test + lint + wasm
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.working-directory }}
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy, rustfmt
          targets: wasm32-wasip1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: venti

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy (all targets, all features)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: test (default features)
        run: cargo test

      - name: test (no-default-features, lib only)
        run: cargo test --lib --no-default-features

      # Parity: golden-value tests always run; the oracle differential is
      # skipped unless VENTI_PYTHON_ORACLE points at a runnable wenta CLI.
      - name: build WASM core
        run: ./scripts/build-wasm.sh --release

      - name: verify WASM exports
        run: |
          test -f target/wasm32-wasip1/release/venti.wasm && echo "wasm built"
          node host/wasm_node_example.js target/wasm32-wasip1/release/venti.wasm

  parity:
    name: parity vs Python oracle (wenta)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && vars.RUN_PYTHON_PARITY == 'true' }}
    defaults:
      run:
        working-directory: ${{ env.working-directory }}
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: venti
      - name: Set up Python reference (uv)
        run: |
          uv sync --extra dev 2>/dev/null || true
      - name: Run oracle differential
        env:
          VENTI_PYTHON_ORACLE: python -m wenta
        run: cargo test --test parity oracle_differential_when_available -- --nocapture

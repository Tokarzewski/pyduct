[project]
name = "wenta"
version = "0.1.0"
description = "Mojo + Python library for ductwork sizing and pressure-drop calculations."
authors = [
    {name = "Tokarzewski", email = "bartlomiej.tokarzewski@gmail.com"},
]
dependencies = [
    "networkx>=3.0",
    "scipy>=1.9.3",
    "pydantic>=2.0",
    "mojo>=1.0.0b2.dev2026051706",
]
requires-python = ">=3.10"
license = {text = "MIT"}

[project.optional-dependencies]
plot = ["matplotlib>=3.6.3"]
yaml = ["pyyaml>=6.0"]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pyyaml>=6.0",
    "matplotlib>=3.6.3",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[[tool.uv.index]]
url = "https://whl.modular.com/nightly/simple/"

# The Python implementation lives under python/ as a reference and is the
# source of truth until the Mojo port reaches parity. Tests run against it.
[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
include = ["pyduct*"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
]
ignore = [
    "E501",  # line length handled by formatter
]

[tool.mypy]
python_version = "3.10"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
files = ["python/pyduct"]

# ---------------------------------------------------------------------------
# Mojo port (work in progress) lives under `wenta/`. The Python package
# remains usable as `import pyduct` until the Mojo side reaches parity.
# ---------------------------------------------------------------------------
